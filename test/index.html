<script type="module">
  import * as context2d from "./util/context2d/cases/index.js";
  import * as dom from "./util/dom/cases/index.js";
  import * as text from "./util/text/cases/index.js";
  import * as shape from "./core/shape/cases/index.js";
  import * as terminal from "./renderer/terminal/cases/index.js";
  import {cases as svg} from "./renderer/svg/cases/index.js";
  import * as vis from "./vis/cases/index.js";
  import * as transition from "./core/transition/cases/index.js";
  import * as visTransition from "./vis/transition/cases/index.js";

  const suites = {context2d, dom, text, shape, terminal, svg, vis, transition, visTransition};

  // Tool
  const tool = document.createElement("div");
  tool.id = "tool";
  tool.style.display = "flex";
  tool.style.gap = "0.5em";
  tool.style.margin = "1em 0px";
  document.body.append(tool);

  // Selects: one for the suite, one for the cases of that suite.
  const typeSelect = createSelect(() => {
    setOptions(caseSelect, Object.keys(suites[typeSelect.value]));
    update();
  });
  const caseSelect = createSelect(update);
  setOptions(typeSelect, Object.keys(suites));
  tool.append(typeSelect, caseSelect);

  const container = document.createElement("div");
  container.id = "container";
  document.body.append(container);

  // Init from the URL, such as ?type=vis&name=visLetterFrequencyColumn.
  const params = new URL(location).searchParams;
  const initialType = params.get("type");
  const initialName = params.get("name");
  typeSelect.value = suites[initialType] ? initialType : (findType(initialName) ?? typeSelect.value);
  setOptions(caseSelect, Object.keys(suites[typeSelect.value]));
  if (suites[typeSelect.value][initialName]) caseSelect.value = initialName;
  render();

  // The arrow keys move through the cases of the selected suite.
  document.onkeydown = (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    switch (event.key) {
      case "ArrowLeft": {
        if (caseSelect.selectedIndex > 0) {
          caseSelect.selectedIndex--;
          update();
        } else alert("This is the first test case.");
        break;
      }
      case "ArrowRight": {
        if (caseSelect.selectedIndex < caseSelect.options.length - 1) {
          caseSelect.selectedIndex++;
          update();
        } else alert("This is the last test case.");
        break;
      }
    }
  };

  function findType(name) {
    return Object.keys(suites).find((type) => suites[type][name]);
  }

  function createSelect(onchange) {
    const select = document.createElement("select");
    select.style.height = "20px";
    select.onchange = onchange;
    return select;
  }

  function setOptions(select, keys) {
    select.replaceChildren(...keys.map(createOption));
  }

  function createOption(key) {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = key;
    return option;
  }

  function update() {
    const type = typeSelect.value;
    const name = caseSelect.value;
    history.pushState({type, name}, "", `?type=${type}&name=${name}`);
    render();
  }

  async function render() {
    const fn = suites[typeSelect.value][caseSelect.value];
    const node = await fn();
    container.innerHTML = "";
    container.append(node);
  }
</script>
